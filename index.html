<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean Shack | Digital Menu</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f6f0e4;color:#17272b}header{background:linear-gradient(145deg,#061f29,#0c6570);color:white;text-align:center;padding:38px 18px}h1{margin:0;letter-spacing:2px}.wrap{max-width:760px;margin:auto;padding:0 15px 24px}.tools{position:sticky;top:0;background:#f6f0e4;padding-top:12px}.search{width:100%;padding:14px 16px;border:1px solid #ded6c7;border-radius:15px;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}.chip{border:0;border-radius:20px;padding:9px 14px;white-space:nowrap}.active{background:#0c6570;color:white}.category{background:#fffdf8;border-radius:18px;padding:15px;margin:16px 0}.category h2{color:#0c6570;border-bottom:2px solid #ddc99e;padding-bottom:8px}.item{display:flex;justify-content:space-between;gap:18px;padding:11px 2px;border-bottom:1px dashed #ded6c7}.name{font-weight:650}.price{font-weight:800;text-align:right}.note{font-size:12px;color:#66777b;margin-top:3px}.state{text-align:center;padding:45px;color:#66777b}footer{text-align:center;background:#07313b;color:#dce9e9;padding:24px 18px;font-size:13px;line-height:1.7}</style></head>
<body><header><h1>OCEAN SHACK</h1><p>Beach Cafe &amp; Family Restaurant · Alappuzha</p></header>
<main class="wrap"><div class="tools"><input id="search" class="search" type="search" placeholder="Search food or drinks…"><div id="chips" class="chips"></div></div><div id="menu"><div class="state">Loading menu…</div></div></main>
<footer><b>OCEAN SHACK</b><br>Seaview Ward, North of United Club, Alappuzha 688001<br>7907629832 · 7907770658<br>Preparation time approximately 20–30 minutes · Parcel charges extra</footer>
<script>
const URL="https://docs.google.com/spreadsheets/d/1BhCWYGNE_P_loKw4emZRsQJ5TQvxNDBNwvTrc9cT2po/gviz/tq?tqx=out:csv&gid=278304338";let items=[],cat="All";
function csv(t){let A=[],r=[],v="",q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c=='"'){if(q&&t[i+1]=='"'){v+='"';i++}else q=!q}else if(c==','&&!q){r.push(v);v=""}else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&t[i+1]=='\n')i++;r.push(v);if(r.some(x=>x.trim()))A.push(r);r=[];v=""}else v+=c}if(v||r.length){r.push(v);A.push(r)}return A}
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function price(p){p=String(p||"").trim();return /^\d+(\.\d+)?$/.test(p)?"₹"+p:esc(p).replace(/\b(\d+)\b/g,"₹$1")}
function render(){let q=document.querySelector("#search").value.toLowerCase(),g={};items.filter(x=>(cat=="All"||x.c==cat)&&(!q||(x.i+" "+x.c+" "+x.n).toLowerCase().includes(q))).forEach(x=>(g[x.c]??=[]).push(x));document.querySelector("#menu").innerHTML=Object.entries(g).map(([c,a])=>`<section class="category"><h2>${esc(c)}</h2>${a.map(x=>`<div class="item"><div><div class="name">${esc(x.i)}</div>${x.n?`<div class="note">${esc(x.n)}</div>`:""}</div><div class="price">${price(x.p)}</div></div>`).join("")}</section>`).join("")||'<div class="state">No matching items found.</div>'}
fetch(URL,{cache:"no-store"}).then(r=>r.text()).then(t=>{let a=csv(t),h=a.shift().map(x=>x.trim().toLowerCase()),ix=n=>h.indexOf(n);items=a.map(r=>({c:r[ix("category")]||"",i:r[ix("item")]||"",p:r[ix("price")]||"",a:r[ix("available")]||"",s:r[ix("sort order")]||"",n:r[ix("notes")]||""})).filter(x=>x.c&&x.i&&x.a.toUpperCase()!="NO").sort((a,b)=>(+a.s||9999)-(+b.s||9999));let cs=["All",...new Set(items.map(x=>x.c))];document.querySelector("#chips").innerHTML=cs.map(c=>`<button class="chip ${c=="All"?"active":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x==b));render()});render()}).catch(()=>document.querySelector("#menu").innerHTML='<div class="state">Menu could not load. Please refresh.</div>');
document.querySelector("#search").addEventListener("input",render);
</script></body></html>
